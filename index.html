<div class="backdrop" aria-hidden="true"><div class="texture"></div><canvas id="grain"></canvas><div class="shade"></div></div>
<main>

  <section class="hero">
    <h1>Fast, guarded runtime<br><span>for production AI systems.</span></h1>

  </section>
</main>
<script>
  // Low-frequency, fine-grain monochrome static with slowly drifting haze.
  const canvas = document.getElementById('grain');
  const ctx = canvas.getContext('2d', { alpha:true });
  let w,h,refreshTimer;
  function resize(){ w=canvas.width=Math.max(1,Math.floor(innerWidth/2.5)); h=canvas.height=Math.max(1,Math.floor(innerHeight/2.5)); drawNoise(); }
  function drawNoise(){
    const img=ctx.createImageData(w,h);
    for(let i=0;i<img.data.length;i+=4){
      const v=Math.random()*255;
      img.data[i]=img.data[i+1]=img.data[i+2]=v;
      img.data[i+3]=18+Math.random()*36;
    }
    ctx.putImageData(img,0,0);
    clearTimeout(refreshTimer);
    refreshTimer=setTimeout(drawNoise,1500);
  }
  resize(); addEventListener('resize',resize);
</script>
</body>
